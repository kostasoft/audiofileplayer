group 'com.google.flutter.plugins.audiofileplayer'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        // jcenter()
		mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.2.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        // jcenter()
		mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
	namespace 'com.google.flutter.plugins.audiofileplayer'
    buildToolsVersion '36.1.0'
    compileSdkVersion rootProject.ext.compileSdkVersionProject
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersionProject
        targetSdkVersion rootProject.ext.targetSdkVersionProject
    }

	
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.core:core:1.0.0'
    implementation 'androidx.media:media:1.3.0'
}
